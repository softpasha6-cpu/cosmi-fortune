name: Deploy Cosmic Fortune to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Optimize game artwork for Telegram
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re
          js = Path("mockup-overlay.js")
          source = js.read_text()
          refs = set(re.findall(r'(?:https://raw\\.githubusercontent\\.com/[^"\\s)]+/|\\./)([^/"\\s)]+\\.(?:png|jpe?g|jpeg))', source, re.I))
          for name in sorted(refs):
              path = Path(name)
              if not path.exists():
                  print("Skip missing artwork:", name)
                  continue
              out = path.with_suffix(".webp")
              with Image.open(path) as im:
                  im.thumbnail((1400, 1400), Image.Resampling.LANCZOS)
                  if im.mode not in ("RGB", "RGBA"):
                      im = im.convert("RGBA" if "transparency" in im.info else "RGB")
                  im.save(out, "WEBP", quality=82, method=6)
              source = source.replace(name, out.name)
              source = source.replace("./" + name, "./" + out.name)
              source = source.replace("https://raw.githubusercontent.com/softpasha6-cpu/cosmi-fortune/main/" + name, "./" + out.name)
              path.unlink()
              print(f"{name} -> {out.name} ({out.stat().st_size} bytes)")
          js.write_text(source)
          PY
      - name: Validate JavaScript syntax
        run: node --check mockup-overlay.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
