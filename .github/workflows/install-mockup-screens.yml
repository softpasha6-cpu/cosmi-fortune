name: Install mockup screens
on:
  push:
    branches: [main]
    paths:
      - 'cosmic_fortune_mockup_assets.zip'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract screen images
        run: |
          mkdir -p assets/screens
          unzip -o cosmic_fortune_mockup_assets.zip -d /tmp/cf-assets
          cp /tmp/cf-assets/assets/screens/*.jpg assets/screens/
          test "$(find assets/screens -maxdepth 1 -name '*.jpg' | wc -l)" -eq 8
      - name: Commit screen images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screens
          if git diff --cached --quiet; then
            echo "No screen changes"
          else
            git commit -m "Install Cosmic Fortune mockup screens"
            git push
          fi
